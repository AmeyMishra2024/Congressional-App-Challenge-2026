<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#183153" />
    <title>Sprout: Offline</title>
    <style>
      body {
        font:
          18px/1.65 system-ui,
          sans-serif;
        background: #fff8ec;
        color: #183153;
        margin: 0;
        padding: 32px;
      }
      main {
        max-width: 540px;
        margin: 10vh auto;
      }
      button {
        background: #f2be45;
        color: #183153;
        border: 0;
        border-radius: 8px;
        padding: 15px 24px;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline.</h1>
      <p>
        Reconnect to open your saved learning space. Your account and practice
        money are not stored in this offline page.
      </p>
      <p>
        No trades or changes have been queued. After reconnecting, review the
        latest prices before making a decision.
      </p>
      <form action="/" method="get">
        <button>Try again when connected</button>
      </form>
    </main>
  </body>
</html>
